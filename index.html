<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine's Day Proposal for Ava</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff0f5 0%, #f8e1e9 50%, #e0f7fa 100%);
      font-family: 'Georgia', serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* iPhone frame simulation */
    .phone-frame {
      width: 100%;
      max-width: 380px;
      height: 780px;
      background: #000;
      border-radius: 58px;
      padding: 12px;
      box-shadow: 
        0 20px 60px rgba(0,0,0,0.6),
        inset 0 0 10px rgba(255,255,255,0.08);
      position: relative;
      overflow: hidden;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #fff5f8 0%, #ffebee 100%);
      border-radius: 46px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Floating background flowers — always visible */
    .flower {
      position: absolute;
      opacity: 0.25;
      pointer-events: none;
      font-size: 3.2rem;
      z-index: 1;
    }

    .flower1 { top: 8%; left: 6%; animation: float 9s infinite ease-in-out; }
    .flower2 { top: 18%; right: 10%; animation: float 11s infinite ease-in-out; }
    .flower3 { bottom: 22%; left: 12%; animation: float 10s infinite ease-in-out; }
    .flower4 { bottom: 15%; right: 8%; animation: float 13s infinite ease-in-out; }
    .flower5 { top: 40%; left: 18%; animation: float 14s infinite ease-in-out; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-35px) rotate(10deg); }
    }

    /* Proposal content */
    .content {
      z-index: 10;
      text-align: center;
      padding: 0 30px;
    }

    h1 {
      color: #d81b60;
      font-size: 2.4rem;
      margin-bottom: 24px;
      line-height: 1.2;
    }

    .romantic-message {
      color: #444;
      font-size: 1.18rem;
      line-height: 1.7;
      margin-bottom: 50px;
      font-style: italic;
    }

    .buttons-container {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .button {
      border: none;
      border-radius: 50px;
      padding: 16px 40px;
      font-size: 1.35rem;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }

    .yes-button {
      background: #ff4081;
      color: white;
      box-shadow: 0 6px 20px rgba(255,64,129,0.4);
    }

    .yes-button:hover {
      transform: scale(1.12);
      box-shadow: 0 10px 30px rgba(255,64,129,0.55);
    }

    .no-button {
      background: #90a4ae;
      color: white;
      position: relative;
    }

    /* Celebration overlay */
    .celebration {
      display: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 20;
      color: white;
    }

    .avatar {
      font-size: 7rem;
      margin-bottom: 20px;
      animation: bounce 1.6s infinite;
    }

    .celebration h2 {
      font-size: 2.6rem;
      margin: 20px 0;
      text-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-20px); }
    }

    /* Falling flower rain (more garden-style) */
    .rain-flower {
      position: absolute;
      top: -80px;
      font-size: 2.8rem;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 5;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="phone-screen">

      <!-- Always visible floating garden flowers -->
      <div class="flower flower1">🌸</div>
      <div class="flower flower2">🌹</div>
      <div class="flower flower3">🌸</div>
      <div class="flower flower4">🌹</div>
      <div class="flower flower5">💐</div>

      <!-- Proposal screen -->
      <div class="content" id="proposal">
        <h1>Will you be my<br>Valentine, Ava? 💗</h1>

        <div class="romantic-message">
          <p>From the moment you came into my life,</p>
          <p>every day turned into a beautiful garden</p>
          <p>filled with moments with you.</p>
          <p style="margin-top: 20px;">I can’t imagine my world without you.</p>
        </div>

        <div class="buttons-container">
          <button class="button yes-button" onclick="handleYes()">Yes 💖</button>
          <button class="button no-button" onclick="handleNo(event)">No 🙃</button>
        </div>
      </div>

      <!-- Celebration screen -->
      <div class="celebration" id="celebration">
        <div class="avatar">🥰</div>
        <h2>For you, Ava 💙<br>Happy Valentine’s Day!</h2>
      </div>

    </div>
  </div>

  <script>
    function handleYes() {
      document.getElementById("proposal").style.display = "none";
      document.getElementById("celebration").style.display = "flex";
      startFlowerRain();
    }

    function handleNo(event) {
      const btn = event.target;
      const x = (Math.random() - 0.5) * 160;
      const y = (Math.random() - 0.5) * 120;
      btn.style.transform = `translate(${x}px, ${y}px)`;
      btn.style.transition = "transform 0.4s";
    }

    function startFlowerRain() {
      const flowers = ["🌸", "🌹", "🌺", "💐", "🌷", "🥀"];

      setInterval(() => {
        const flower = document.createElement("div");
        flower.className = "rain-flower";
        flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
        
        flower.style.left = Math.random() * 100 + "%";
        flower.style.animationDuration = (4 + Math.random() * 5) + "s";
        flower.style.opacity = 0.7 + Math.random() * 0.3;

        document.querySelector(".phone-screen").appendChild(flower);

        setTimeout(() => flower.remove(), 10000);
      }, 280);
    }
  </script>

</body>
</html>
