<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine's Day Proposal for Ava</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff5f9 0%, #ffebee 50%, #e8f5ff 100%);
      font-family: 'Georgia', serif;
      overflow: hidden;
      position: relative;
    }

    /* Floating large garden flowers – very visible */
    .floating-flower {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      opacity: 0.45;
      font-size: 5.5rem;
      animation: float 14s infinite ease-in-out;
    }

    .f1 { top: 6%;  left: 5%;  animation-duration: 16s; }
    .f2 { top: 12%; right: 8%;  animation-duration: 19s; }
    .f3 { bottom: 18%; left: 10%; animation-duration: 21s; }
    .f4 { bottom: 10%; right: 6%;  animation-duration: 17s; }
    .f5 { top: 38%; left: 14%;  animation-duration: 23s; }
    .f6 { top: 55%; right: 12%; animation-duration: 18s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-60px) rotate(15deg); }
    }

    /* Main content – centered */
    .content-wrapper {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .content {
      text-align: center;
      max-width: 700px;
    }

    h1 {
      color: #c2185b;
      font-size: clamp(2.6rem, 7vw, 4.2rem);
      margin-bottom: 32px;
      line-height: 1.15;
      text-shadow: 0 2px 10px rgba(0,0,0,0.08);
    }

    .romantic-message {
      color: #333;
      font-size: clamp(1.18rem, 4vw, 1.45rem);
      line-height: 1.75;
      margin-bottom: 60px;
      font-style: italic;
    }

    .buttons-container {
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .button {
      border: none;
      border-radius: 50px;
      padding: 18px 52px;
      font-size: clamp(1.4rem, 4.5vw, 1.7rem);
      cursor: pointer;
      transition: all 0.35s;
      font-weight: bold;
    }

    .yes-button {
      background: #ff4081;
      color: white;
      box-shadow: 0 10px 30px rgba(255, 64, 129, 0.5);
    }

    .yes-button:hover {
      transform: scale(1.14);
      box-shadow: 0 15px 40px rgba(255, 64, 129, 0.65);
    }

    .no-button {
      background: #78909c;
      color: white;
    }

    /* Celebration overlay */
    .celebration {
      display: none;
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #ff8fab 0%, #ffccdd 100%);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 30;
      color: white;
    }

    .avatar {
      font-size: clamp(7rem, 20vw, 11rem);
      margin-bottom: 30px;
      animation: bounce 1.8s infinite;
    }

    .celebration h2 {
      font-size: clamp(2.6rem, 7vw, 4rem);
      text-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-30px); }
    }

    /* Continuous gentle flower rain – peonies & roses from the start */
    .rain-flower {
      position: absolute;
      top: -120px;
      pointer-events: none;
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      animation: fall linear infinite;
      z-index: 3;
      opacity: 0.7;
    }

    @keyframes fall {
      to {
        transform: translateY(140vh) rotate(900deg);
      }
    }
  </style>
</head>
<body>

  <!-- Large floating flowers – clearly visible -->
  <div class="floating-flower f1">🌸</div>
  <div class="floating-flower f2">🌹</div>
  <div class="floating-flower f3">🌸</div>
  <div class="floating-flower f4">🌹</div>
  <div class="floating-flower f5">🌸</div>
  <div class="floating-flower f6">💐</div>

  <!-- Continuous flower rain container -->
  <div id="rain-container"></div>

  <div class="content-wrapper">
    <div class="content" id="proposal">
      <h1>Will you be my<br>Valentine, Ava? 💗</h1>

      <div class="romantic-message">
        <p>From the moment you came into my life,</p>
        <p>every day turned into a beautiful garden</p>
        <p>filled with moments with you.</p>
        <p style="margin-top: 28px;">I can’t imagine my world without you.</p>
      </div>

      <div class="buttons-container">
        <button class="button yes-button" onclick="handleYes()">Yes 💖</button>
        <button class="button no-button" onclick="handleNo(event)">No 🙃</button>
      </div>
    </div>

    <!-- Celebration -->
    <div class="celebration" id="celebration">
      <div class="avatar">🥰</div>
      <h2>For you, Ava 💙<br>Happy Valentine’s Day!</h2>
    </div>
  </div>

  <script>
    // Gentle continuous rain from page load
    function startGentleRain() {
      const flowers = ["🌸","🌸","🌸","🌹","🌹","🌺","💐","🌷"];
      
      function createFlower() {
        const flower = document.createElement("div");
        flower.className = "rain-flower";
        flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
        
        flower.style.left = Math.random() * 100 + "%";
        flower.style.animationDuration = (6 + Math.random() * 9) + "s"; // 6–15 seconds
        flower.style.opacity = 0.5 + Math.random() * 0.4;
        flower.style.transform = `rotate(${Math.random() * 360}deg)`;

        document.getElementById("rain-container").appendChild(flower);

        setTimeout(() => flower.remove(), 18000);
      }

      // Start rain immediately
      createFlower();
      // Then every 400–900ms
      setInterval(createFlower, 400 + Math.random() * 500);
    }

    // Intense rain for celebration
    function startCelebrationRain() {
      const flowers = ["🌸","🌹","🌺","💐","🌷","🥀","🌻","🌼"];
      
      setInterval(() => {
        const flower = document.createElement("div");
        flower.className = "rain-flower";
        flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
        
        flower.style.left = Math.random() * 100 + "%";
        flower.style.animationDuration = (3 + Math.random() * 4) + "s";
        flower.style.opacity = 0.8 + Math.random() * 0.2;
        flower.style.fontSize = (2.8 + Math.random() * 2) + "rem";

        document.getElementById("rain-container").appendChild(flower);
        setTimeout(() => flower.remove(), 10000);
      }, 180);
    }

    function handleYes() {
      document.getElementById("proposal").style.display = "none";
      document.getElementById("celebration").style.display = "flex";
      // Celebration gets faster/more intense rain
      startCelebrationRain();
    }

    function handleNo(event) {
      const btn = event.target;
      const x = (Math.random() - 0.5) * 260;
      const y = (Math.random() - 0.5) * 180;
      btn.style.transform = `translate(${x}px, ${y}px)`;
      btn.style.transition = "transform 0.6s";
    }

    // Start gentle flower rain immediately when page loads
    window.onload = function() {
      startGentleRain();
    };
  </script>

</body>
</html>
